services:
  - type: web
    name: aidar
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn aidar.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
