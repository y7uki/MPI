; Положить в /etc/supervisor/conf.d/aidar.conf
[program:aidar]
command=/home/USER/aidar/venv/bin/uwsgi --ini /home/USER/aidar/deploy/uwsgi.ini
directory=/home/USER/aidar
user=USER
autostart=true
autorestart=true
startsecs=3
stopsignal=QUIT
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/USER/aidar/logs/supervisor.log
stdout_logfile_maxbytes=5MB
environment=DJANGO_DEBUG="0",DJANGO_SECRET_KEY="CHANGE_ME",DJANGO_ALLOWED_HOSTS="example.com"
