[uwsgi]
# Путь к проекту на сервере (поменяйте под себя)
chdir = /home/USER/aidar
module = aidar.wsgi:application
home = /home/USER/aidar/venv

master = true
processes = 2
threads = 2
socket = /home/USER/aidar/aidar.sock
chmod-socket = 666
vacuum = true
die-on-term = true
env = DJANGO_SETTINGS_MODULE=aidar.settings
env = DJANGO_DEBUG=0
logto = /home/USER/aidar/logs/uwsgi.log
