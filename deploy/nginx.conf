# Положить в /etc/nginx/sites-available/aidar и сделать симлинк в sites-enabled
server {
    listen 80;
    server_name example.com;   # ваш домен или IP

    client_max_body_size 10M;

    location /static/ {
        alias /home/USER/aidar/staticfiles/;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass unix:/home/USER/aidar/aidar.sock;
    }
}
