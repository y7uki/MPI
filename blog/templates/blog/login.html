{% extends 'blog/base.html' %}

{% block title %}Вход на сайт{% endblock %}

{% block content %}
<div class="card">
    <h2>Вход в личный кабинет</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #2c3e50; color: #fff; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
            Войти
        </button>
    </form>
    <p style="margin-top: 15px;">Нет аккаунта? <a href="/register/">Зарегистрироваться</a></p>
</div>
{% endblock %}
