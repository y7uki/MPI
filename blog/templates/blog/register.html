{% extends 'blog/base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="card">
    <h2>Создать аккаунт</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #2c3e50; color: #fff; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
            Зарегистрироваться
        </button>
    </form>
    <p>Уже есть аккаунт? <a href="/accounts/login/">Войти</a></p>
</div>
{% endblock %}
